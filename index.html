<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f1e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Europa Conquest - Jeu de stratégie mobile">
  <title>Europa Conquest</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div id="app">

    <header id="topbar">
      <div class="stat"><span class="icon">📅</span><span id="ui-turn">T1</span></div>
      <div class="stat" id="ui-country-stat"><span class="icon">🏛️</span><span id="ui-country">-</span></div>
      <div class="stat"><span class="icon">💰</span><span id="ui-gold">0</span></div>
      <div class="stat"><span class="icon">🗺️</span><span id="ui-territories">0</span></div>
    </header>

    <div id="map-container">
      <svg id="map" viewBox="0 0 600 850" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="sea-grad" cx="50%" cy="50%" r="80%">
            <stop offset="0%" stop-color="#1a2842"/>
            <stop offset="100%" stop-color="#0a0e1c"/>
          </radialGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <rect width="600" height="850" fill="url(#sea-grad)"/>
        <g id="layer-connections"></g>
        <g id="layer-territories"></g>
        <g id="layer-labels"></g>
        <g id="layer-fx"></g>
      </svg>
      <div id="map-hint" class="hint hidden"></div>
    </div>

    <div id="bottom-panel">
      <div id="info-panel">
        <h2 id="ui-selected-name">Sélectionnez un territoire</h2>
        <div id="ui-selected-stats"></div>
      </div>
      <div id="actions">
        <button id="btn-recruit" disabled>Recruter (10💰)</button>
        <button id="btn-end-turn">Fin du tour</button>
      </div>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-content" id="modal-content"></div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
